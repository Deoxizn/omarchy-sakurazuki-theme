# hyprland.conf
# Theme: Sakurazuki - Omarchy
# Sakura moonlit plum / muted rose

# Rose -> moonlit plum gradient
$activeBorderColor = rgba(b6849dee) rgba(c994b3ee) rgba(a1809acc)
$inactiveBorderColor = rgba(655763aa)

animations {
    bezier = sakura, 0.35, 0, 0.65, 1
    animation = borderangle, 1, 28, sakura, once
}

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 3
    gaps_in = 6
    gaps_out = 12
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.97

    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.18
        special = false
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000088)
    }
}
